[package]
name = "void-rcs-docking-lab"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["window"]
window = ["dep:bevy"]

[[bin]]
name = "void-rcs-docking-lab"
path = "src/main.rs"
required-features = ["window"]

[dependencies]
bevy = { workspace = true, optional = true }
glam.workspace = true
void-assembly.workspace = true
void-vessels.workspace = true
void-landing.workspace = true
void-fleet-flight = { path = "../fleet-flight" }
void-modules.workspace = true
void-frames.workspace = true
